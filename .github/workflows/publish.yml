name: Publish to Comfy Registry
# Manual only. Adding this file or pushing code does not publish a node.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check publisher metadata and secret
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text())
          publisher = data['tool']['comfy'].get('PublisherId', '')
          repository = data['project'].get('urls', {}).get('Repository', '')
          if not publisher or publisher.startswith('YOUR-'):
              raise SystemExit('Set the real Registry PublisherId in pyproject.toml first.')
          if not repository.startswith('https://github.com/liconstudio/'):
              raise SystemExit('Check the public repository URL before publishing.')
          if not os.environ.get('REGISTRY_ACCESS_TOKEN'):
              raise SystemExit('Add the REGISTRY_ACCESS_TOKEN repository secret first.')
      - name: Installer regression (no GPU)
        run: python -B .github/scripts/installer_ci.py
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
